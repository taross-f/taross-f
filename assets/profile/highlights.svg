<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 164" width="960" height="164" role="img" aria-labelledby="title desc">
  <title id="title">Highlights</title>
  <desc id="desc">Edge-AI image recognition deployed to 3,000+ devices. Data warehouse redesign cut query time by 50%. In software since 2009.</desc>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .up { animation: up .7s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .drop { animation: drop .7s cubic-bezier(.34, 1.4, .64, 1) both; }
    @keyframes drop { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="up" style="animation-delay:0.10s">
    <rect x="0.50" y="0.5" width="308.33" height="163" rx="14" fill="#131c2c" stroke="#22304d"/>
    <g class="drop" style="animation-delay:0.35s"><g transform="translate(38.00 30)"><rect x="-18" y="-7" width="36" height="14" rx="3" fill="#ffd166" stroke="#8a6a14" stroke-width="1.2"/><rect x="-17" y="-6" width="34" height="4" rx="2" fill="#ffffff" opacity="0.22"/></g></g>
    <text class="sans" x="20.00" y="90" font-size="42" font-weight="800" fill="#ffd166">3,000+</text>
    <text class="sans" x="20.00" y="120" font-size="15" font-weight="600" fill="#e8eef9">edge-AI devices</text>
    <text class="sans" x="20.00" y="142" font-size="13" fill="#8fa2c4">running image recognition</text>
  </g>
  <g class="up" style="animation-delay:0.22s">
    <rect x="325.83" y="0.5" width="308.33" height="163" rx="14" fill="#131c2c" stroke="#22304d"/>
    <g class="drop" style="animation-delay:0.47s"><g transform="translate(363.33 30)"><rect x="-18" y="-7" width="36" height="14" rx="3" fill="#ff8a7a" stroke="#8c3a32" stroke-width="1.2"/><rect x="-17" y="-6" width="34" height="4" rx="2" fill="#ffffff" opacity="0.22"/></g></g>
    <text class="sans" x="345.33" y="90" font-size="42" font-weight="800" fill="#ff8a7a">−50%</text>
    <text class="sans" x="345.33" y="120" font-size="15" font-weight="600" fill="#e8eef9">DWH query time</text>
    <text class="sans" x="345.33" y="142" font-size="13" fill="#8fa2c4">after a warehouse redesign</text>
  </g>
  <g class="up" style="animation-delay:0.34s">
    <rect x="651.17" y="0.5" width="308.33" height="163" rx="14" fill="#131c2c" stroke="#22304d"/>
    <g class="drop" style="animation-delay:0.59s"><g transform="translate(688.67 30)"><rect x="-18" y="-7" width="36" height="14" rx="3" fill="#5fd4c4" stroke="#1f6f66" stroke-width="1.2"/><rect x="-17" y="-6" width="34" height="4" rx="2" fill="#ffffff" opacity="0.22"/></g></g>
    <text class="sans" x="670.67" y="90" font-size="42" font-weight="800" fill="#5fd4c4">2009</text>
    <text class="sans" x="670.67" y="120" font-size="15" font-weight="600" fill="#e8eef9">in software since</text>
    <text class="sans" x="670.67" y="142" font-size="13" fill="#8fa2c4">SI → games → IoT → AI</text>
  </g>
</svg>

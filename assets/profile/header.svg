<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Taro Furuya</title>
  <desc id="desc">Executive Officer at PKSHA Communication, leading software engineering for AI SaaS products. Based in Saitama, Japan.</desc>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .up { animation: up .7s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .drop { animation: drop .85s cubic-bezier(.34, 1.25, .64, 1) both; }
    @keyframes drop { from { opacity: 0; transform: translateY(-300px); } 25% { opacity: 1; } to { opacity: 1; transform: none; } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2, .8, .2, 1) .55s both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
    .ghost { animation: blink 2.4s ease-in-out 1.8s infinite both; }
    @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: .95; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#17223b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1a2436" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="960" height="280" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="280" fill="url(#bg)"/>
    <rect width="960" height="280" fill="url(#grid)" opacity="0.7"/>
    <rect width="960" height="280" fill="url(#glow)"/>

    <text class="mono up" x="56" y="72" font-size="14" letter-spacing="4" fill="#8fa2c4" style="animation-delay:0.00s">HELLO, I'M</text>
    <text class="sans up" x="54" y="130" font-size="58" font-weight="700" fill="#e8eef9" style="animation-delay:0.10s">Taro Furuya</text>
    <rect class="bar" x="56" y="146" width="72" height="4" rx="2" fill="#ffd166"/>
    <text class="sans up" x="56" y="180" font-size="16" fill="#8fa2c4" style="animation-delay:0.20s">古屋 太郎  ·  Saitama, Japan</text>
    <g class="up" style="animation-delay:0.30s">
      <rect x="56" y="198" width="362" height="32" rx="16" fill="#ffd166" fill-opacity="0.1" stroke="#ffd166" stroke-opacity="0.55"/>
      <text class="mono" x="72" y="219" font-size="14" fill="#ffd166">Executive Officer @ PKSHA Communication</text>
    </g>
    <text class="sans up" x="56" y="258" font-size="16" fill="#c5d1e6" style="animation-delay:0.40s">Leading software engineering for AI SaaS products.</text>

    <rect x="640" y="240" width="240" height="9" fill="#31405f"/>
    <line x1="640" y1="240" x2="880" y2="240" stroke="#5a729e" stroke-width="2"/>
    <g class="drop" style="animation-delay:0.25s"><g transform="translate(700 227) rotate(0)"><rect x="-35" y="-13" width="70" height="26" rx="3" fill="#7cb8ff" stroke="#2a5590" stroke-width="1.2"/><rect x="-34" y="-12" width="68" height="4" rx="2" fill="#ffffff" opacity="0.22"/></g></g>
    <g class="drop" style="animation-delay:0.41s"><g transform="translate(782 228) rotate(0)"><rect x="-42" y="-12" width="84" height="24" rx="3" fill="#5fd4c4" stroke="#1f6f66" stroke-width="1.2"/><rect x="-41" y="-11" width="82" height="4" rx="2" fill="#ffffff" opacity="0.22"/></g></g>
    <g class="drop" style="animation-delay:0.57s"><g transform="translate(742 203) rotate(1)"><rect x="-55" y="-11" width="110" height="22" rx="3" fill="#ffd166" stroke="#8a6a14" stroke-width="1.2"/><rect x="-54" y="-10" width="108" height="4" rx="2" fill="#ffffff" opacity="0.22"/></g></g>
    <g class="drop" style="animation-delay:0.73s"><g transform="translate(722 176) rotate(-3)"><rect x="-23" y="-15" width="46" height="30" rx="3" fill="#ff8a7a" stroke="#8c3a32" stroke-width="1.2"/><rect x="-22" y="-14" width="44" height="4" rx="2" fill="#ffffff" opacity="0.22"/></g></g>
    <g class="drop" style="animation-delay:0.89s"><g transform="translate(776 179) rotate(2)"><rect x="-26" y="-13" width="52" height="26" rx="3" fill="#b39dfa" stroke="#4e3d8f" stroke-width="1.2"/><rect x="-25" y="-12" width="50" height="4" rx="2" fill="#ffffff" opacity="0.22"/></g></g>
    <g class="drop" style="animation-delay:1.05s"><g transform="translate(750 150) rotate(-1.5)"><rect x="-50" y="-10" width="100" height="20" rx="3" fill="#ffd166" stroke="#8a6a14" stroke-width="1.2"/><rect x="-49" y="-9" width="98" height="4" rx="2" fill="#ffffff" opacity="0.22"/></g></g>
    <g class="drop" style="animation-delay:1.21s"><g transform="translate(764 118) rotate(8)"><rect x="-19" y="-19" width="38" height="38" rx="3" fill="#ff8a7a" stroke="#8c3a32" stroke-width="1.2"/><rect x="-18" y="-18" width="36" height="4" rx="2" fill="#ffffff" opacity="0.22"/></g></g>
    <g class="drop" style="animation-delay:1.37s"><g transform="translate(752 87) rotate(-4)"><rect x="-31" y="-9" width="62" height="18" rx="3" fill="#5fd4c4" stroke="#ffffff" stroke-width="2"/><rect x="-30" y="-8" width="60" height="4" rx="2" fill="#ffffff" opacity="0.22"/></g></g>
    <g class="ghost" opacity="0.5">
      <line x1="752" y1="48" x2="752" y2="72" stroke="#ffd166" stroke-width="1" stroke-dasharray="3 3"/>
      <rect x="727" y="20" width="50" height="20" rx="3" fill="none" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text class="mono" x="790" y="35" font-size="12" fill="#ffd166">next drop: you?</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="959" height="279" rx="18" fill="none" stroke="#22304d"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 693" width="960" height="693" role="img" aria-labelledby="title desc">
  <title id="title">Career</title>
  <desc id="desc">2021.09 to present: Engineering Manager · FDE at PKSHA Technology. now: Engineering Manager &amp; Forward Deployed Engineer. 2024.12: Executive Officer at PKSHA Communication, led AI SaaS engineering. 2021.09: Engineering Manager at PKSHA Workplace, AI helpdesk for large enterprises. PKSHA Communication and PKSHA Workplace were merged into PKSHA Technology in July 2025. 2018.08 to 2023.12: Lead Engineer at REVISIO (formerly TVISION INSIGHTS). IoT and image processing. Rolled out edge-AI image recognition to 3,000+ devices, and redesigned the data warehouse to cut query time by 50%.  2012.04 to 2018.07: Engineering Manager at gloops. Social and native mobile games: development, operations and team management.  2009.04 to 2012.03: Engineer at Sobal. Started out in systems integration. </desc>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .up { animation: up .7s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes pulse { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }
    .rail { animation: rail 1.2s cubic-bezier(.2, .8, .2, 1) both; transform-box: fill-box; transform-origin: top; }
    @keyframes rail { from { transform: scaleY(0); } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

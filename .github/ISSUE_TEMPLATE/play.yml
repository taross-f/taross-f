name: 🔵 Place a dot / 点を打つ
description: Place one dot on the shared grid. Nobody knows when the dots will connect
title: 'dot: '
labels: ['play']
body:
  - type: markdown
    attributes:
      value: |
        You can't connect the dots looking forward. Place one anyway — where?
        Dots within 2 steps of each other are linked, but no line is drawn until a chain of them reaches from the left edge to the right. Then the whole path lights up.

        点は、打っているあいだはつながらない。それでも打つ。次は、どこに打つ？
        2 マス以内の点同士は見えないところでつながっています。その連なりが左端から右端まで届いたとき、道筋が一気に描かれます。
  - type: input
    id: x
    attributes:
      label: x (1–16, left to right)
      placeholder: '7'
    validations:
      required: true
  - type: input
    id: y
    attributes:
      label: y (1–9, bottom to top)
      placeholder: '3'
    validations:
      required: true

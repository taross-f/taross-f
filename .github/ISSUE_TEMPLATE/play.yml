name: 🔵 Place a dot / 点を打つ
description: Pick a point on the future grid and extend the line from now
title: 'dot: '
labels: ['play']
body:
  - type: markdown
    attributes:
      value: |
        Looking back, the dots connect. Where does the next one go?
        The line is drawn from the previous dot to yours. If it touches the line already drawn, the dots have connected and the chapter is complete.

        これまでの点はつながった。これからは点を打っていく — 次は、どこに打つ？
        直前の点からあなたの点まで線が引かれます。それまでの線に触れたら、点がつながって章が完成します。
  - type: input
    id: x
    attributes:
      label: x (1–12, left to right)
      placeholder: '7'
    validations:
      required: true
  - type: input
    id: y
    attributes:
      label: y (1–9, bottom to top)
      placeholder: '3'
    validations:
      required: true
